services:
  db:
    image: postgres:18
    ports:
      - '5433:5432'
    environment:
      POSTGRES_USER: minstrel
      POSTGRES_PASSWORD: minstrel
      POSTGRES_DB: minstrel
    volumes:
      - db-data:/var/lib/postgresql
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U minstrel -d minstrel']
      interval: 2s
      retries: 15

volumes:
  db-data:
