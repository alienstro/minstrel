packages:
  - "apps/*"
  - "packages/*"

# Vercel moves the built API files to the top of its function, away from the
# apps/api/node_modules links that the default pnpm layout makes. With real
# package folders in the top node_modules, the moved API still finds them.
nodeLinker: hoisted

allowBuilds:
  esbuild: true
  sharp: false
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@next/env@16.4.2'
  - '@next/eslint-plugin-next@16.4.2'
  - '@next/swc-darwin-arm64@16.4.2'
  - '@next/swc-darwin-x64@16.4.2'
  - '@next/swc-linux-arm64-gnu@16.4.2'
  - '@next/swc-linux-arm64-musl@16.4.2'
  - '@next/swc-linux-x64-gnu@16.4.2'
  - '@next/swc-linux-x64-musl@16.4.2'
  - '@next/swc-win32-arm64-msvc@16.4.2'
  - '@next/swc-win32-x64-msvc@16.4.2'
  - eslint-config-next@16.4.2
  - next@16.4.2
